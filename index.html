<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RAZE ESPORT — Portail interactif</title><style>
:root{color-scheme:dark;--gold:#f7c85d;--red:#ff304a;--blue:#4daaff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060606;color:#f5f5f5;font:15px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.scene{width:100%;height:100dvh;position:relative;overflow:hidden;background:#070707}.scene img{width:100%;height:100%;object-fit:fill;display:block}/* Original artwork is almost exactly 16:9; use contain and background for any different ratio. */.scene{background-image:url('assets/accueil-raze-esport.png');background-size:cover;background-position:center}.scene img{object-fit:contain}.hot{position:absolute;border:0;background:transparent;border-radius:12px;outline-offset:2px}.hot:hover{background:rgba(255,255,255,.085);box-shadow:inset 0 0 0 1px rgba(255,220,110,.35)}.hot:focus-visible{outline:2px solid var(--gold)}.hot.card:hover{background:rgba(255,255,255,.035)}.screen{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;display:none;overflow:auto;backdrop-filter:blur(10px)}.screen.open{display:block}.panel{max-width:1100px;margin:4vh auto;padding:28px;border:1px solid #78643d;background:linear-gradient(145deg,#171717,#070707);border-radius:20px;box-shadow:0 18px 90px #000}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:clamp(23px,4vw,40px);margin:8px 0;color:var(--gold)}.close,.btn{padding:12px 18px;border:1px solid #a88440;background:#18130b;color:#fff;border-radius:9px}.close:hover,.btn:hover{background:#3c2b12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin:22px 0}.tile{background:#121212;border:1px solid #343434;border-radius:12px;padding:20px;min-height:115px}.tile h3{margin-top:0;color:var(--gold)}.muted{color:#aaa}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}.field{background:#0b0b0b;color:white;border:1px solid #555;border-radius:8px;padding:11px;max-width:100%;width:100%}textarea.field{min-height:110px}label{display:block;margin:14px 0 5px}.pill{display:inline-block;padding:7px 12px;border:1px solid #8c713b;border-radius:99px;color:#e9c474}.badge{color:#fff;background:#7a2433;padding:4px 8px;border-radius:6px}.idea{border-bottom:1px solid #333;padding:15px 0}.idea button{margin-left:12px}.notice{border:1px solid #624e22;background:#201a0c;border-radius:10px;padding:14px;margin:15px 0}.back{margin:12px 0}.small{font-size:12px}.screen[data-theme=red] .top h1{color:#ff5266}.screen[data-theme=blue] .top h1{color:#67b4ff}@media(max-width:700px){.scene{height:auto;aspect-ratio:1672/941;min-height:0}.panel{margin:0;min-height:100dvh;border-radius:0;padding:18px}.top h1{font-size:23px}.hot{border-radius:3px}}@media(min-aspect-ratio:2/1){.scene img{object-fit:contain}}
</style></head><body><main class="scene" id="scene" aria-label="Accueil RAZE ESPORT"><img id="art" src="assets/accueil-raze-esport.png" alt="Accueil RAZE ESPORT, trois univers Championship, Cards et Private Match"></main><section class="screen" id="screen" role="dialog" aria-modal="true" aria-label="Espace interactif"><div class="panel"><div class="top"><h1 id="heading"></h1><button class="close" onclick="hide()">✕ Retour à l'accueil</button></div><div id="content"></div></div></section><script>
const scene=document.getElementById('scene'),art=document.getElementById('art'),screen=document.getElementById('screen'),heading=document.getElementById('heading'),content=document.getElementById('content');
// Coordinates expressed as fractions of the exact supplied artwork, not guessed from a replacement layout.
const spots=[
['Accueil',.239,.008,.06,.076,'home'],['Raze Championship',.301,.008,.098,.075,'champ'],['Raze Cards',.403,.008,.065,.075,'cards'],['Private Match',.472,.008,.076,.075,'match'],['Communauté',.55,.008,.08,.075,'community'],['Boutique',.626,.008,.064,.075,'shop'],['Recherche',.701,.008,.035,.075,'search'],['Notifications',.74,.008,.038,.075,'notifications'],['Profil',.783,.008,.141,.075,'profile'],['Logo RAZE',.155,.006,.069,.074,'home'],
['Raze Championship',.095,.307,.264,.468,'champ'],['Raze Cards',.372,.307,.255,.468,'cards'],['Private Match',.64,.307,.265,.468,'match'],
['Communauté active',.046,.87,.228,.092,'community'],['Compte unique',.275,.87,.211,.092,'profile'],['Progression globale',.487,.87,.226,.092,'match'],['Récompenses',.716,.87,.245,.092,'champ']];
function layout(){document.querySelectorAll('.hot').forEach(e=>e.remove());let w=scene.clientWidth,h=scene.clientHeight,iw=1672,ih=941,scale=Math.min(w/iw,h/ih),vw=iw*scale,vh=ih*scale,ox=(w-vw)/2,oy=(h-vh)/2;spots.forEach(([name,x,y,sw,sh,id])=>{let b=document.createElement('button');b.className='hot '+(['champ','cards','match'].includes(id)?'card':'');b.title=name;b.setAttribute('aria-label',name);b.style.cssText=`left:${ox+x*vw}px;top:${oy+y*vh}px;width:${sw*vw}px;height:${sh*vh}px`;b.onclick=()=>show(id);scene.append(b)})}window.addEventListener('resize',layout);art.addEventListener('load',layout);layout();
let player=localStorage.getItem('raze_demo_name')||'Raze_Player',votes=JSON.parse(localStorage.getItem('raze_demo_ideas')||'[]'),packs=+(localStorage.getItem('raze_demo_packs')||'5'),collection=JSON.parse(localStorage.getItem('raze_demo_collection')||'[]'),mmr=+(localStorage.getItem('raze_demo_mmr')||'1000');let current='home';
function save(){localStorage.setItem('raze_demo_name',player);localStorage.setItem('raze_demo_ideas',JSON.stringify(votes));localStorage.setItem('raze_demo_packs',packs);localStorage.setItem('raze_demo_collection',JSON.stringify(collection));localStorage.setItem('raze_demo_mmr',mmr)}function hide(){screen.classList.remove('open');document.body.style.overflow=''}function show(id){if(id==='home'){hide();return}current=id;screen.classList.add('open');document.body.style.overflow='hidden';screen.scrollTop=0;render()}document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
function render(){let titles={champ:'RAZE CHAMPIONSHIP',cards:'RAZE CARDS',match:'PRIVATE MATCH',community:'COMMUNAUTÉ',shop:'BOUTIQUE',search:'RECHERCHE',notifications:'NOTIFICATIONS',profile:'PROFIL JOUEUR',ideas:'AVIS & IDÉES'};heading.textContent=titles[current]||'RAZE ESPORT';screen.dataset.theme=current==='cards'?'red':current==='match'?'blue':'';let html='';if(current==='champ')html=`<p class="muted">Espace de démonstration indépendant — tournois Discord.</p><div class="grid"><div class="tile"><h3>🏆 Tournois</h3><p>RAZE Open • 2v2</p><span class="pill">Inscriptions ouvertes (démo)</span><div class="row"><button class="btn" onclick="alert('Inscription simulée : aucun tournoi réel modifié.')">S'inscrire</button></div></div><div class="tile"><h3>📅 Calendrier</h3><p>Prochain événement : à annoncer</p><button class="btn" onclick="alert('Calendrier de démonstration')">Voir le calendrier</button></div><div class="tile"><h3>🥇 Classements</h3><p>1. Raze Alpha — 12 pts<br>2. Raze Nova — 9 pts<br>3. Raze Prime — 6 pts</p></div></div><button class="btn" onclick="alert('Tableau de tournoi fictif — intégration à venir')">Afficher le bracket</button>`;
if(current==='cards')html=`<p class="muted">Booster et collection de démonstration : aucune connexion au véritable RAZE CARDS.</p><div class="grid"><div class="tile"><h3>🎴 Ouvrir un booster</h3><p>Boosters restants : <b>${packs}</b></p><button class="btn" onclick="openPack()">Ouvrir 5 cartes</button></div><div class="tile"><h3>📚 Ma collection</h3><p>${collection.length} carte(s) obtenue(s)</p><button class="btn" onclick="showCollection()">Voir mes cartes</button></div><div class="tile"><h3>✨ Ma vitrine</h3><p>Une vitrine de démonstration</p><button class="btn" onclick="showVitrine()">Ouvrir la vitrine</button></div></div><div id="cardsResult"></div>`;
if(current==='match')html=`<p class="muted">Files fictives : le véritable bot 6Mans n'est pas connecté.</p><div class="grid"><div class="tile"><h3>🎮 File 2v2</h3><p id="queue2">Aucune file rejointe</p><button class="btn" onclick="toggleQueue(2)">Rejoindre / quitter</button></div><div class="tile"><h3>🎮 File 3v3</h3><p id="queue3">Aucune file rejointe</p><button class="btn" onclick="toggleQueue(3)">Rejoindre / quitter</button></div><div class="tile"><h3>📊 Mon MMR (démo)</h3><p>${mmr} MMR</p><button class="btn" onclick="simulateMatch()">Simuler un résultat</button></div></div><div class="tile"><h3>Classement fictif</h3>1. Raze_Player — 1300 MMR<br>2. Monster — 1220 MMR<br>3. Santaury — 1160 MMR</div>`;
if(current==='community')html=`<div class="grid"><div class="tile"><h3>👥 Communauté RAZE</h3><p>Retrouve les joueurs, les événements et les actualités.</p></div><div class="tile"><h3>💡 Avis & Idées</h3><p>Propose des améliorations et vote.</p><button class="btn" onclick="show('ideas')">Accéder aux idées</button></div></div>`;
if(current==='ideas')html=`<div class="notice">Les idées et les votes sont stockés uniquement dans ce navigateur pour cet aperçu.</div><label>Projet concerné</label><select class="field" id="project"><option>RAZE ESPORT HUB</option><option>RAZE CHAMPIONSHIP</option><option>RAZE CARDS</option><option>PRIVATE MATCH</option></select><label>Titre</label><input class="field" id="ideaTitle" maxlength="90" placeholder="Ex. : Ajouter un calendrier"><label>Proposition</label><textarea class="field" id="ideaText" placeholder="Décris ton idée..."></textarea><div class="row"><button class="btn" onclick="addIdea()">Publier une idée (démo)</button></div><h2>Propositions</h2><div id="ideasList">${votes.length?votes.map((v,i)=>`<div class="idea"><span class="pill">${esc(v.project)}</span><h3>${esc(v.title)}</h3><p>${esc(v.text)}</p><button class="btn" onclick="upvote(${i})">▲ ${v.votes} vote(s)</button></div>`).join(''):'Aucune idée pour le moment.'}</div>`;
if(current==='profile')html=`<div class="tile"><h3>👤 Profil de démonstration</h3><label>Pseudo</label><input class="field" id="nickname" maxlength="30" value="${esc(player)}"><div class="row"><button class="btn" onclick="player=document.getElementById('nickname').value.trim()||'Raze_Player';save();render()">Enregistrer</button></div><p class="muted">Aucun compte réel n'est créé.</p></div>`;
if(current==='shop')html=`<div class="tile"><h3>🛍️ Boutique RAZE</h3><p>Section de présentation, aucun achat possible pour le moment.</p></div>`;
if(current==='notifications')html=`<div class="tile"><h3>🔔 Notifications</h3><p>Bienvenue sur l'aperçu de RAZE ESPORT HUB.</p><p class="muted">Aucune notification réelle.</p></div>`;
if(current==='search')html=`<label>Rechercher un univers</label><input class="field" id="searchInput" placeholder="championship, cards, match, avis..." oninput="findPage(this.value)"><div id="searchResults" class="row"></div>`;
content.innerHTML=html+'<div class="notice small">APERÇU INTERACTIF — données fictives, sauvegardées localement sur cet appareil. Aucun lien avec tes sites existants.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openPack(){if(!packs){alert('Réserve de démonstration épuisée');return}packs--;let rar=['Commun','Peu commun','Rare','Super rare','Ultra rare','Légendaire','Divin'];let got=Array.from({length:5},(_,i)=>({name:'Carte RAZE #'+(collection.length+i+1),rare:rar[Math.floor(Math.random()*rar.length)]}));collection.push(...got);save();render();document.getElementById('cardsResult').innerHTML='<div class="grid">'+got.map(c=>`<div class="tile"><h3>${esc(c.name)}</h3><p>${esc(c.rare)}</p></div>`).join('')+'</div>'}function showCollection(){document.getElementById('cardsResult').innerHTML='<div class="grid">'+(collection.map(c=>`<div class="tile"><h3>${esc(c.name)}</h3>${esc(c.rare)}</div>`).join('')||'<p>Collection vide.</p>')+'</div>'}function showVitrine(){document.getElementById('cardsResult').innerHTML='<div class="tile"><h3>✨ Ma vitrine</h3><p>'+collection.slice(-5).map(c=>esc(c.name)).join(' • ')+'</p><button class="btn" onclick="this.parentElement.style.boxShadow=this.parentElement.style.boxShadow?\'\':\'0 0 40px #e6b74a\'">Allumer / éteindre</button></div>'}let queues={2:false,3:false};function toggleQueue(n){queues[n]=!queues[n];document.getElementById('queue'+n).textContent=queues[n]?'Dans la file '+n+'v'+n+' (démo)':'Aucune file rejointe'}function simulateMatch(){mmr+=Math.random()>.5?12:-9;save();render()}function addIdea(){let title=document.getElementById('ideaTitle').value.trim(),desc=document.getElementById('ideaText').value.trim();if(!title||!desc){alert('Ajoute un titre et une description.');return}votes.unshift({project:document.getElementById('project').value,title,text:desc,votes:0});save();render()}function upvote(i){votes[i].votes++;save();render()}function findPage(q){let arr=[['champ','RAZE CHAMPIONSHIP'],['cards','RAZE CARDS'],['match','PRIVATE MATCH'],['community','COMMUNAUTÉ'],['ideas','AVIS & IDÉES']];document.getElementById('searchResults').innerHTML=arr.filter(a=>a[1].toLowerCase().includes(q.toLowerCase())).map(a=>`<button class="btn" onclick="show('${a[0]}')">${a[1]}</button>`).join('')}
</script></body></html>
