<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RAZE ESPORT — Portail communautaire</title><style>
:root{color-scheme:dark;--gold:#f6c64b;--red:#ee3348;--blue:#35a5ff}*{box-sizing:border-box}body{margin:0;background:#08090b;color:#eee;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.canvas{position:relative;width:100%;max-width:1536px;margin:auto}.canvas img{width:100%;display:block}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:9px;touch-action:manipulation}.hot:focus-visible,.hot:hover{outline:2px solid rgba(255,212,102,.75);outline-offset:-3px;background:rgba(255,255,255,.045)}.mobile{display:none}.hint{text-align:center;padding:12px;color:#aaa;font-size:12px}.shade{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10;display:none;align-items:center;justify-content:center;padding:15px;backdrop-filter:blur(8px)}.shade.show{display:flex}.modal{width:min(680px,100%);max-height:90dvh;overflow:auto;border:1px solid #66552c;background:linear-gradient(145deg,#1b1c20,#0b0c10 70%);border-radius:16px;box-shadow:0 24px 100px #000;padding:24px;position:relative}.modal h2{margin:0 35px 8px 0;color:var(--gold);font-size:25px}.modal p{line-height:1.55;color:#c6c6c6}.close{position:absolute;right:15px;top:12px;font-size:25px;background:none;border:0;color:#fff;cursor:pointer}.btn{background:#17181c;border:1px solid #ac8734;border-radius:9px;color:#fff;padding:12px 15px;cursor:pointer;margin:5px 5px 5px 0;font-weight:650}.btn:hover{background:#322914}.btn.red{border-color:#a83342}.btn.blue{border-color:#2d7dba}.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tile{background:#15161a;border:1px solid #37383e;border-radius:12px;padding:15px;margin:10px 0}.tile b{color:#f4d68a}.muted{color:#a3a3a3;font-size:13px}input,textarea,select{background:#101115;color:#fff;border:1px solid #53545b;border-radius:8px;padding:12px;width:100%;margin:7px 0;font:inherit}textarea{min-height:90px;resize:vertical}.status{padding:12px;border-left:3px solid var(--gold);background:#282318;border-radius:5px;margin:12px 0}.tag{color:#f4d68a;font-size:12px}nav.mobile{background:#0b0b0e;position:sticky;bottom:0;z-index:3;grid-template-columns:repeat(4,1fr);border-top:1px solid #5b4c2c}nav.mobile button{border:0;background:none;color:#e8e8e8;padding:12px 2px;font-size:12px}.pill{border:1px solid #555;border-radius:999px;padding:5px 10px;display:inline-block;margin:3px;color:#ccc}.count{font-size:24px;color:var(--gold);font-weight:800}@media(max-width:700px){.canvas{min-width:0}.mobile{display:grid}.hint{padding:8px}.modal{padding:19px}.modal h2{font-size:22px}}
</style></head><body><main class="canvas"><img alt="Accueil RAZE ESPORT — maquette originale conservée" src="assets/accueil-raze-esport.png">
<!-- zones cliquables calquées sur l'image originale 1536x1024 -->
<button class="hot" style="left:2%;top:0%;width:12%;height:9%" aria-label="Accueil" onclick="go('home')"></button>
<button class="hot" style="left:20%;top:0%;width:7%;height:9%" aria-label="Accueil" onclick="go('home')"></button>
<button class="hot" style="left:27%;top:0%;width:10%;height:9%" aria-label="RAZE Championship" onclick="go('champ')"></button>
<button class="hot" style="left:37%;top:0%;width:8%;height:9%" aria-label="RAZE Cards" onclick="go('cards')"></button>
<button class="hot" style="left:45%;top:0%;width:9%;height:9%" aria-label="Private Match" onclick="go('match')"></button>
<button class="hot" style="left:54%;top:0%;width:9%;height:9%" aria-label="Communauté" onclick="go('community')"></button>
<button class="hot" style="left:63%;top:0%;width:6%;height:9%" aria-label="Boutique" onclick="go('shop')"></button>
<button class="hot" style="left:74%;top:0%;width:5%;height:9%" aria-label="Recherche" onclick="go('search')"></button>
<button class="hot" style="left:79%;top:0%;width:4%;height:9%" aria-label="Notifications" onclick="go('notifications')"></button>
<button class="hot" style="left:83%;top:0%;width:16%;height:9%" aria-label="Profil" onclick="go('profile')"></button>
<button class="hot" style="left:2%;top:35%;width:31%;height:47%" aria-label="Accéder à RAZE Championship" onclick="go('champ')"></button>
<button class="hot" style="left:35%;top:35%;width:31%;height:47%" aria-label="Accéder à RAZE Cards" onclick="go('cards')"></button>
<button class="hot" style="left:67%;top:35%;width:31%;height:47%" aria-label="Accéder à Private Match" onclick="go('match')"></button>
<button class="hot" style="left:0%;top:87%;width:25%;height:10%" aria-label="Communauté" onclick="go('community')"></button>
<button class="hot" style="left:25%;top:87%;width:25%;height:10%" aria-label="Compte unique" onclick="go('profile')"></button>
<button class="hot" style="left:50%;top:87%;width:25%;height:10%" aria-label="Progression" onclick="go('stats')"></button>
<button class="hot" style="left:75%;top:87%;width:25%;height:10%" aria-label="Récompenses" onclick="go('rewards')"></button>
</main><nav class="mobile"><button onclick="go('home')">⌂ Accueil</button><button onclick="go('champ')">🏆 Tournois</button><button onclick="go('cards')">▣ Cartes</button><button onclick="go('match')">🎮 Matchs</button></nav><div class="hint">Aperçu de démonstration • Touchez un panneau ou un élément du menu • Aucun site réel n'est modifié</div>
<div id="shade" class="shade" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><button class="close" aria-label="Fermer" onclick="closeModal()">×</button><h2 id="title"></h2><div id="body"></div></section></div>
<script>
let nickname=localStorage.getItem('raze_demo_name')||'Raze_Player';let boosts=Number(localStorage.getItem('raze_demo_boosts')||3);let collection=JSON.parse(localStorage.getItem('raze_demo_collection')||'[]');let queue='';let ideas=JSON.parse(localStorage.getItem('raze_demo_ideas')||'[]');let joined=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function modal(title,body){document.getElementById('title').textContent=title;document.getElementById('body').innerHTML=body;document.getElementById('shade').classList.add('show')}
function closeModal(){document.getElementById('shade').classList.remove('show')}
function message(s){const el=document.getElementById('feedback');if(el)el.textContent=s}
function go(page){let title='',body='';switch(page){
case 'home':closeModal();return;
case 'champ':title='🏆 RAZE CHAMPIONSHIP';body=`<p>Univers des tournois Rocket League du Discord RAZE.</p><div class="tile"><b>Tournoi de démonstration — 2v2</b><p>8 équipes • Élimination directe • Inscriptions simulées</p><button class="btn" onclick="joined=!joined;go('champ')">${joined?'✓ Inscrit — Se désinscrire':'S’inscrire au tournoi'}</button><button class="btn" onclick="go('bracket')">Voir le tableau</button></div><div class="row"><button class="btn" onclick="go('rank')">Classement</button><button class="btn" onclick="go('admin')">Mode organisateur</button></div><p class="muted">Les inscriptions et les tournois sont fictifs.</p>`;break;
case 'bracket':title='Tableau du tournoi — Démo';body='<div class="tile">Quart de finale → Demi-finale → Finale</div><div class="tile">Équipe Alpha 2 — 1 Équipe Bravo</div><div class="tile">Équipe Charlie 0 — 2 Équipe Delta</div><div class="tile">Finale : à venir</div><button class="btn" onclick="go(\'champ\')">Retour aux tournois</button>';break;
case 'rank':title='Classements — Démo';body='<div class="tile">🥇 Team Alpha — 1200 pts</div><div class="tile">🥈 Team Delta — 980 pts</div><div class="tile">🥉 Team Bravo — 840 pts</div>';break;
case 'admin':title='Espace organisateur — Démo';body='<p>Prévisualisation du formulaire de création de tournoi.</p><input id="tourname" placeholder="Nom du tournoi"><select id="tourformat"><option>2v2</option><option>3v3</option><option>1v1</option></select><button class="btn" onclick="message(\'Tournoi de démonstration créé (non publié).\')">Créer un tournoi fictif</button><div id="feedback" class="status">Aucun tournoi réel ne sera créé.</div>';break;
case 'cards':title='🃏 RAZE CARDS';body=`<p>Ouvre des boosters, découvre tes cartes et explore ta collection.</p><div class="tile"><span class="muted">Boosters disponibles (démo)</span><div class="count">${boosts}</div><button class="btn red" onclick="openBooster()" ${boosts<=0?'disabled':''}>Ouvrir un booster (5 cartes)</button><button class="btn" onclick="boosts=3;localStorage.setItem('raze_demo_boosts',boosts);go('cards')">Réinitialiser la démo</button></div><div class="row"><button class="btn" onclick="go('collection')">Ma collection (${collection.length})</button><button class="btn" onclick="go('showcase')">Ma vitrine</button></div>`;break;
case 'collection':title='Ma collection — Démo';body=collection.length?collection.map((x,i)=>`<div class="tile">#${String(i+1).padStart(3,'0')} — ${esc(x)}</div>`).join(''):'<p>Tu ne possèdes pas encore de cartes dans cette démonstration.</p>';body+='<button class="btn" onclick="go(\'cards\')">Retour aux boosters</button>';break;
case 'showcase':title='Ma vitrine — Démo';body=`<div id="showcase" class="tile" style="text-align:center;min-height:180px;background:linear-gradient(#1b1c20,#090909)"><h3>✦ VITRINE RAZE ✦</h3><p>${collection.length?esc(collection.slice(-5).join(' · ')):'Aucune carte exposée'}</p></div><button class="btn" onclick="document.getElementById('showcase').style.boxShadow=document.getElementById('showcase').style.boxShadow?'':'inset 0 0 65px #b88730'">Allumer / Éteindre</button>`;break;
case 'match':title='🎮 PRIVATE MATCH';body=`<p>Files Rocket League 2v2 et 3v3. Classements MMR séparés.</p><div class="tile"><b>File actuelle :</b> ${queue?esc(queue):'Aucune'}<div class="row"><button class="btn blue" onclick="queue=queue==='2v2'?'':'2v2';go('match')">${queue==='2v2'?'Quitter':'Rejoindre'} 2v2</button><button class="btn blue" onclick="queue=queue==='3v3'?'':'3v3';go('match')">${queue==='3v3'?'Quitter':'Rejoindre'} 3v3</button></div></div><button class="btn" onclick="go('mmr')">Classement MMR</button><button class="btn" onclick="go('history')">Historique</button><p class="muted">La file est une simulation : aucun bot Discord n'est contacté.</p>`;break;
case 'mmr':title='Classement MMR — Démo';body='<div class="tile"><b>2v2</b><p>1. Monster — 1450<br>2. Santaury — 1320<br>3. Alex — 1260</p></div><div class="tile"><b>3v3</b><p>1. Santaury — 1390<br>2. Monster — 1340<br>3. Nayko — 1200</p></div>';break;
case 'history':title='Historique — Démo';body='<div class="tile">2v2 • Victoire • +18 MMR</div><div class="tile">3v3 • Défaite • −12 MMR</div>';break;
case 'community':title='👥 Communauté RAZE';body='<p>Retrouve la communauté RAZE ESPORT, les actualités et les propositions des membres.</p><button class="btn" onclick="go(\'ideas\')">💡 Avis & Idées</button><button class="btn" onclick="go(\'notifications\')">Actualités</button>';break;
case 'ideas':title='💡 Avis & Idées';body=`<p>Propose une fonctionnalité, donne ton avis ou signale un problème.</p><input id="ideaTitle" maxlength="90" placeholder="Titre de la proposition"><select id="ideaProject"><option>RAZE ESPORT</option><option>RAZE CHAMPIONSHIP</option><option>RAZE CARDS</option><option>PRIVATE MATCH</option></select><select id="ideaType"><option>Nouvelle fonctionnalité</option><option>Amélioration</option><option>Avis</option><option>Bug</option></select><textarea id="ideaDesc" placeholder="Décris ton idée..."></textarea><button class="btn" onclick="submitIdea()">Publier dans la démo</button><div id="feedback" class="muted">Les idées sont enregistrées uniquement sur cet appareil.</div><h3>Propositions des membres (démo)</h3><div id="ideasList">${renderIdeas()}</div>`;break;
case 'profile':title='👤 Profil joueur';body=`<p>Compte de démonstration — non relié à Discord.</p><label>Pseudo<input id="nick" value="${esc(nickname)}" maxlength="25"></label><button class="btn" onclick="nickname=document.getElementById('nick').value.trim()||'Raze_Player';localStorage.setItem('raze_demo_name',nickname);message('Pseudo enregistré sur cet appareil.')">Enregistrer</button><div id="feedback" class="status">Connecté en mode aperçu.</div><button class="btn" onclick="go('stats')">Mes statistiques</button>`;break;
case 'stats':title='Progression globale — Démo';body=`<div class="tile">Joueur : <b>${esc(nickname)}</b></div><div class="tile">Cartes obtenues : <b>${collection.length}</b></div><div class="tile">Tournoi : <b>${joined?'Inscrit':'Non inscrit'}</b></div><div class="tile">File Private Match : <b>${queue||'Aucune'}</b></div>`;break;
case 'rewards':title='Récompenses exclusives';body='<p>Futur espace des récompenses RAZE : tournois, cartes et événements.</p><div class="tile">🏆 Récompenses de tournoi</div><div class="tile">🃏 Cartes événementielles</div>';break;
case 'shop':title='Boutique RAZE — Concept';body='<p>Cette section est prévue dans la maquette, mais aucune boutique n’est actuellement connectée.</p><button class="btn" onclick="go(\'ideas\')">Proposer une idée de boutique</button>';break;
case 'notifications':title='🔔 Notifications';body='<div class="tile">Bienvenue dans la démonstration RAZE ESPORT !</div><div class="tile">Les trois univers sont accessibles en mode aperçu.</div>';break;
case 'search':title='🔎 Rechercher';body='<input id="query" placeholder="Championship, Cards, Private Match, Avis..."><button class="btn" onclick="searchNow()">Rechercher</button><div id="feedback" class="muted"></div>';break;
}modal(title,body)}
function openBooster(){if(boosts<=0)return;boosts--;localStorage.setItem('raze_demo_boosts',boosts);let rarities=['Commune','Peu commune','Rare','Super rare','Ultra rare','Légendaire','Divin'];let drawn=Array.from({length:5},()=>rarities[Math.floor(Math.pow(Math.random(),2)*rarities.length)]);collection.push(...drawn);localStorage.setItem('raze_demo_collection',JSON.stringify(collection));modal('✨ Booster ouvert !',`<p>Tu as obtenu 5 cartes :</p>${drawn.map((x,i)=>`<div class="tile">🃏 Carte ${i+1} — <b>${x}</b></div>`).join('')}<button class="btn" onclick="go('cards')">Retour aux boosters</button><button class="btn" onclick="go('collection')">Voir ma collection</button>`)}
function renderIdeas(){return ideas.length?ideas.slice().reverse().map((x,i)=>`<div class="tile"><span class="tag">${esc(x.project)} • ${esc(x.type)}</span><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><button class="btn" onclick="voteIdea(${ideas.length-1-i})">👍 ${x.votes||0}</button></div>`).join(''):'<div class="tile muted">Aucune proposition pour le moment. Sois le premier !</div>'}
function submitIdea(){let title=document.getElementById('ideaTitle').value.trim(),desc=document.getElementById('ideaDesc').value.trim();if(!title||!desc){message('Ajoute un titre et une description.');return}ideas.push({title,desc,project:document.getElementById('ideaProject').value,type:document.getElementById('ideaType').value,votes:0});localStorage.setItem('raze_demo_ideas',JSON.stringify(ideas));go('ideas');message('Proposition ajoutée à la démonstration locale.')}function voteIdea(i){ideas[i].votes++;localStorage.setItem('raze_demo_ideas',JSON.stringify(ideas));go('ideas')}function searchNow(){let q=document.getElementById('query').value.toLowerCase();let keys=[['championship','champ'],['tournoi','champ'],['cards','cards'],['carte','cards'],['match','match'],['mmr','match'],['idée','ideas'],['avis','ideas'],['communauté','community']];let hit=keys.find(x=>q.includes(x[0]));hit?go(hit[1]):message('Aucun résultat dans cette démonstration.')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
